<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ FutPredict Pro v18.6</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
:root{--p:#00ff88;--s:#00d4ff;--bg:#0a0e1a;--c:rgba(255,255,255,.05);--t:#fff;--t2:#a0a0b0;--d:#ff4757;--w:#ffa502}
body{background:linear-gradient(135deg,var(--bg),#1a1f3a);color:var(--t);min-height:100vh;padding:12px}
h1{font-size:1.5rem;color:var(--p);text-align:center}
.sub{color:var(--t2);font-size:.7rem;text-align:center;margin:4px 0 10px}
.st{background:rgba(0,212,255,.1);border:1px solid var(--s);padding:8px;border-radius:8px;text-align:center;font-size:.78rem;margin:8px 0}
.st.ok{background:rgba(0,255,136,.1);border-color:var(--p)}
.st.err{background:rgba(255,71,87,.15);border-color:var(--d)}
.tabs{display:flex;gap:5px;justify-content:center;margin:10px 0;flex-wrap:wrap}
.tb{background:var(--c);border:1px solid rgba(255,255,255,.2);color:var(--t);padding:7px 12px;border-radius:15px;font-size:.7rem;cursor:pointer}
.tb.on{background:var(--p);color:#0a0e1a;font-weight:bold}
.pane{display:none}.pane.on{display:block}
.row{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.btn{background:var(--c);border:1px solid rgba(255,255,255,.2);color:var(--t);padding:7px 12px;border-radius:8px;font-size:.75rem;cursor:pointer}
.btn.on{background:var(--p);color:#0a0e1a;font-weight:bold}
.btn.go{background:linear-gradient(45deg,var(--p),var(--s));color:#0a0e1a;border:none;font-weight:bold;padding:8px 16px;border-radius:12px}
.chips{display:flex;gap:4px;overflow-x:auto;margin:8px 0;padding-bottom:4px}
.chip{padding:6px 10px;border-radius:15px;font-size:.7rem;white-space:nowrap;cursor:pointer;background:var(--c);border:1px solid rgba(255,255,255,.1);flex-shrink:0}
.chip.on{background:var(--s);color:#0a0e1a;font-weight:bold}
.grid{display:grid;grid-template-columns:1fr;gap:10px;margin:10px 0}
.card{background:var(--c);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:10px;cursor:pointer}
.li{display:flex;justify-content:space-between;font-size:.66rem;color:var(--t2);margin-bottom:6px}
.mt{color:var(--s);font-weight:bold}.lv{color:var(--d);font-weight:bold}.pp{color:var(--w);font-weight:bold}
.teams{display:flex;justify-content:space-between;align-items:center;margin:6px 0}
.tm{text-align:center;flex:1}.tn{font-weight:bold;font-size:.68rem}
.frm{display:flex;gap:2px;justify-content:center;margin-top:3px}
.fd{width:11px;height:11px;border-radius:3px;font-size:.45rem;display:flex;align-items:center;justify-content:center;font-weight:bold}
.fd.W{background:rgba(0,255,136,.3);color:var(--p)}.fd.D{background:rgba(255,165,2,.3);color:var(--w)}.fd.L{background:rgba(255,71,87,.3);color:var(--d)}
.vs{font-weight:bold;color:var(--p);margin:0 6px}
.pbox{background:rgba(0,255,136,.08);border:1px solid rgba(0,255,136,.2);border-radius:8px;padding:8px;margin:6px 0}
.pbox.win{border-color:var(--p)}.pbox.loss{border-color:var(--d)}
.ps{font-size:1.4rem;font-weight:bold;color:var(--p)}
.pt{font-size:.7rem;color:var(--t2);text-align:right}
.pm{display:flex;justify-content:space-between;align-items:center}
.probs{display:flex;gap:4px;margin:5px 0}
.pi{flex:1;text-align:center}.pl{font-size:.52rem;color:var(--t2)}
.pb{height:4px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden;margin:2px 0}
.pf{height:100%;background:var(--p);width:0;transition:width .6s}
.pv{font-size:.66rem;font-weight:bold;color:var(--p)}
.mk{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:5px 0}
.mk3{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:5px 0}
.mi{background:rgba(0,0,0,.2);border-radius:6px;padding:4px;text-align:center}
.ml{font-size:.52rem;color:var(--t2)}.mv{font-size:.72rem;font-weight:bold;color:var(--p)}
.dg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
.dc{background:var(--c);border-radius:12px;padding:10px;text-align:center}
.dn{font-size:1.4rem;font-weight:bold;color:var(--p)}.dl{font-size:.62rem;color:var(--t2)}
.hist{background:var(--c);border-radius:8px;padding:8px;margin:5px 0;display:flex;justify-content:space-between;font-size:.7rem}
.rb{padding:2px 7px;border-radius:8px;font-size:.62rem;font-weight:bold}
.rb.win{background:rgba(0,255,136,.2);color:var(--p)}.rb.loss{background:rgba(255,71,87,.2);color:var(--d)}.rb.pend{background:rgba(255,165,2,.2);color:var(--w)}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:50;justify-content:center;align-items:center;padding:14px}
.modal.on{display:flex}
.mc{background:#1a1f3a;border:2px solid var(--p);border-radius:15px;padding:14px;max-width:480px;width:100%;max-height:85vh;overflow-y:auto;position:relative}
.cx{position:absolute;top:6px;right:12px;font-size:1.6rem;cursor:pointer;color:var(--t2)}
.rw{display:flex;justify-content:space-between;padding:3px 0;font-size:.68rem;border-bottom:1px solid rgba(255,255,255,.06)}
.rw:last-child{border:none}.rl{color:var(--t2)}.rv{font-weight:bold;color:var(--p)}
.sec{margin:8px 0;padding:8px;background:rgba(255,255,255,.05);border-radius:8px}
.stt{font-size:.72rem;color:var(--s);font-weight:bold;margin-bottom:4px}
.note{font-size:.62rem;color:var(--t2);text-align:center;margin:8px 0}
@media(min-width:768px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<h1>⚽ FutPredict Pro</h1>
<div class="sub">v18.6 · stats reales vía endpoint seguro + cuotas + value</div>
<div class="st" id="st">⏳ Conectando...</div>

<div class="tabs">
  <button class="tb on" onclick="tab('m',this)">⚽ Partidos</button>
  <button class="tb" onclick="tab('d',this)">📊 Dashboard</button>
  <button class="tb" onclick="tab('h',this)">📜 Historial</button>
</div>

<div class="pane on" id="pane-m">
  <div class="row">
    <button class="btn" onclick="setD(0,this)">📅 Hoy</button>
    <button class="btn" onclick="setD(1,this)">➡️ Mañana</button>
    <button class="btn on" onclick="setD('w',this)">🗓️ Semana</button>
    <button class="btn go" onclick="load()">🔄 Recargar</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
  <div class="note">Stats = promedios reales de temporada (FutPythonTrader) cuando existen; si no, n/d. Probabilidades = modelo + mercado. +18.</div>
</div>

<div class="pane" id="pane-d">
  <div class="dg">
    <div class="dc"><div class="dn" id="dAcc">--</div><div class="dl">Precisión 1X2 medida</div></div>
    <div class="dc"><div class="dn" id="dN">0</div><div class="dl">Guardadas</div></div>
    <div class="dc"><div class="dn" id="dW">0</div><div class="dl">✅ Acertadas</div></div>
    <div class="dc"><div class="dn" id="dL">0</div><div class="dl">❌ Falladas</div></div>
  </div>
</div>

<div class="pane" id="pane-h"><div id="hlist"></div></div>

<div class="modal" id="modal"><div class="mc"><span class="cx" onclick="closeM()">&times;</span><div id="mb"></div></div></div>

<script>
var DB={preds:{}};try{var r=localStorage.getItem('fp18');if(r)DB=JSON.parse(r);}catch(e){}
if(!DB.preds)DB.preds={};
function save(){try{localStorage.setItem('fp18',JSON.stringify(DB));}catch(e){}}
function $(i){return document.getElementById(i);}
function cl(v,a,b){return Math.max(a,Math.min(b,v));}
function pad2(n){return(n<10?'0':'')+n;}
function factorial(n){var r=1;for(var i=2;i<=n;i++)r*=i;return r;}
function poisson(l,k){return(Math.pow(l,k)*Math.exp(-l))/factorial(k);}
function fairOdds(p){return p<=0?'-':(100/p).toFixed(2);}
function normStatus(s){s=(s||'').toUpperCase();if(s.indexOf('FIN')===0)return 'post';if(s.indexOf('IN')===0||s.indexOf('PAUS')===0||s.indexOf('HALF')===0)return 'in';if(s.indexOf('POST')===0||s.indexOf('SUSP')===0||s.indexOf('CANC')===0)return 'postp';return 'pre';}
function normNameC(s){return String(s).toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();}
function markets(h,a){var o15=0,o25=0,o35=0,bt=0,sc=[];for(var x=0;x<=7;x++)for(var y=0;y<=7;y++){var p=poisson(h,x)*poisson(a,y);sc.push({h:x,a:y,p:p});if(x+y>1.5)o15+=p;if(x+y>2.5)o25+=p;if(x+y>3.5)o35+=p;if(x>0&&y>0)bt+=p;}sc.sort(function(m,n){return n.p-m.p;});return{o15:Math.round(o15*100),o25:Math.round(o25*100),o35:Math.round(o35*100),bt:Math.round(bt*100),top:sc.slice(0,3)};}
function fmtT(i){try{var d=new Date(i);return pad2(d.getHours())+':'+pad2(d.getMinutes());}catch(e){return '';}}
function dateKey(i){var d=new Date(i);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function formHTML(a){if(!a||!a.length)return '';return '<div class="frm">'+a.map(function(r){return '<span class="fd '+r+'">'+r+'</span>';}).join('')+'</div>';}
var ALL=[],curD='w',curL='all',SCLIENT={};

function load(){
  $('st').className='st';$('st').textContent='⏳ Conectando...';
  var ctl=new AbortController();var to=setTimeout(function(){ctl.abort();},12000);
  fetch('api/predictions',{signal:ctl.signal}).then(function(r){clearTimeout(to);return r.json();}).then(function(d){
    if(!d.ok)throw new Error(d.error||'backend devolvió error');
    ALL=d.predictions||[];
    $('st').className='st ok';$('st').textContent='✅ '+ALL.length+' partidos reales ('+(d.window?d.window.from+'→'+d.window.to:'')+')'+(d.oddsEnabled?' · 💰 cuotas':'');
    sync();chips();render();dash();enrichStats();
  }).catch(function(e){
    clearTimeout(to);
    $('st').className='st err';
    $('st').innerHTML='🐞 '+e.message+' <button class="btn go" onclick="load()">Reintentar</button>';
    $('grid').innerHTML='';
  });
}
function findTeamC(agg,name){var n=normNameC(name);if(agg[n])return agg[n];for(var k in agg){if(n.indexOf(k)!==-1||k.indexOf(n)!==-1)return agg[k];}return null;}
function enrichStats(){
  var lgs={};ALL.forEach(function(m){var st=normStatus(m.status);if(st==='pre'||st==='in')lgs[m.league]=1;});
  var need=Object.keys(lgs).filter(function(l){return SCLIENT[l]===undefined;}).slice(0,3);
  if(!need.length)return;
  Promise.all(need.map(function(l){
    return fetch('api/stats?league='+encodeURIComponent(l)).then(function(r){return r.json();}).then(function(d){SCLIENT[l]=(d&&d.ok)?d.teams:null;}).catch(function(){SCLIENT[l]=null;});
  })).then(function(){
    var changed=false;
    ALL.forEach(function(m){var agg=SCLIENT[m.league];if(!agg||m.stats)return;var h=findTeamC(agg,m.home),a=findTeamC(agg,m.away);if(h&&a){m.stats={home:h,away:a};changed=true;}});
    if(changed){render();$('st').textContent=$('st').textContent+' · 📊 stats';}
  });
}
function sync(){var ch=false;ALL.forEach(function(m){var st=normStatus(m.status);var k=String(m.id);
  if(st==='pre'&&!DB.preds[k]){var mk=markets(m.hL,m.aL);DB.preds[k]={id:k,home:m.home,away:m.away,league:m.league,pred:m.main,score:mk.top[0].h+'-'+mk.top[0].a,ou:((m.hL+m.aL)>2.5?'Over':'Under'),bt:(mk.bt>=50?'Sí':'No'),estado:'pend',rs:null};ch=true;}
  if(st==='post'&&m.score&&DB.preds[k]&&DB.preds[k].estado==='pend'){var p=DB.preds[k];p.rs=m.score.home+'-'+m.score.away;var real=m.score.home>m.score.away?'home':(m.score.home<m.score.away?'away':'draw');p.estado=(p.pred===real)?'win':'loss';ch=true;}
});if(ch)save();}
function chips(){var s={};ALL.forEach(function(m){s[m.league]=1;});var n=Object.keys(s).slice(0,14);
  var h='<div class="chip '+(curL==='all'?'on':'')+'" onclick="setL(\'all\')">🌍 Todas</div>';
  n.forEach(function(x){h+='<div class="chip '+(curL===x?'on':'')+'" onclick="setL(\''+x.replace(/'/g,"\\'")+'\')">'+x+'</div>';});
  $('chips').innerHTML=h;}
function setL(v){curL=v;chips();render();}
function setD(v,el){curD=v;var b=document.querySelectorAll('.row .btn');for(var i=0;i<b.length;i++)b[i].classList.remove('on');el.classList.add('on');render();}
function tkey(){if(curD==='w')return null;var d=new Date();d.setDate(d.getDate()+curD);return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function statsBlock(m){
  if(m.stats){var s=m.stats;
    return '<div class="mk3"><div class="mi"><div class="ml">Tiros</div><div class="mv">'+s.home.sh+'-'+s.away.sh+'</div></div><div class="mi"><div class="ml">A puerta</div><div class="mv">'+s.home.sot+'-'+s.away.sot+'</div></div><div class="mi"><div class="ml">Córners</div><div class="mv">'+s.home.cor+'-'+s.away.cor+'</div></div></div>'+
    '<div class="mk3"><div class="mi"><div class="ml">Faltas</div><div class="mv">'+s.home.fou+'-'+s.away.fou+'</div></div><div class="mi"><div class="ml">Amarillas</div><div class="mv">'+s.home.yc+'-'+s.away.yc+'</div></div><div class="mi"><div class="ml">xG</div><div class="mv">'+s.home.xg+'-'+s.away.xg+'</div></div></div>';}
  return '<div class="mk3"><div class="mi"><div class="ml">Faltas</div><div class="mv">n/d</div></div><div class="mi"><div class="ml">Posesión</div><div class="mv">n/d</div></div><div class="mi"><div class="ml">Tarjetas</div><div class="mv">n/d</div></div></div>';
}
function render(){var tk=tkey();var list=ALL.filter(function(m){if(curL!=='all'&&m.league!==curL)return false;if(tk&&dateKey(m.time)!==tk)return false;return true;});
  if(!list.length){$('grid').innerHTML='<div class="note">😕 Sin partidos para este filtro.</div>';return;}
  var h='';list.forEach(function(m){var st=normStatus(m.status);var mk=markets(m.hL,m.aL);var sv=DB.preds[String(m.id)];
    var mt=m.main==='home'?'Victoria Local':(m.main==='away'?'Victoria Visitante':'Empate');
    var mp=Math.max(m.probs.home,m.probs.draw,m.probs.away);
    h+='<div class="card" onclick="openM('+m.id+')">'+
      '<div class="li"><span>'+m.league+'</span><span class="'+(st==='in'?'lv':(st==='post'?'pp':'mt'))+'">'+(st==='in'?'🔴 EN VIVO':(st==='post'?'FINAL':(st==='postp'?'POSPUESTO':'🕐 '+fmtT(m.time))))+'</span></div>'+
      '<div class="teams"><div class="tm"><div class="tn">'+m.home+'</div>'+formHTML(m.formHome)+'</div><div class="vs">'+((st==='post'&&m.score)?(m.score.home+'-'+m.score.away):'VS')+'</div><div class="tm"><div class="tn">'+m.away+'</div>'+formHTML(m.formAway)+'</div></div>';
    if(st==='post'&&sv&&sv.rs){h+='<div class="pbox '+(sv.estado==='win'?'win':'loss')+'"><div class="ps">'+sv.rs+'</div><div class="pt">Pred: '+sv.score+' → '+(sv.estado==='win'?'✅ Acertada':'❌ Fallada')+'</div></div>';}
    else if(st==='post'){h+='<div class="pbox"><div class="ps">'+(m.score?(m.score.home+'-'+m.score.away):'?')+'</div><div class="pt">Final</div></div>';}
    else{var sc=sv?sv.score:(mk.top[0].h+'-'+mk.top[0].a);
      h+='<div class="pbox"><div class="pm"><div class="ps">'+sc+'</div><div class="pt">'+mt+'<br>@'+fairOdds(mp)+'</div></div></div>'+
      '<div class="probs"><div class="pi"><div class="pl">Local</div><div class="pb"><div class="pf" data-w="'+m.probs.home+'"></div></div><div class="pv">'+m.probs.home+'%</div></div><div class="pi"><div class="pl">Empate</div><div class="pb"><div class="pf" data-w="'+m.probs.draw+'"></div></div><div class="pv">'+m.probs.draw+'%</div></div><div class="pi"><div class="pl">Visit.</div><div class="pb"><div class="pf" data-w="'+m.probs.away+'"></div></div><div class="pv">'+m.probs.away+'%</div></div></div>'+
      '<div class="mk"><div class="mi"><div class="ml">+1.5</div><div class="mv">'+mk.o15+'%</div></div><div class="mi"><div class="ml">+2.5</div><div class="mv">'+mk.o25+'%</div></div><div class="mi"><div class="ml">+3.5</div><div class="mv">'+mk.o35+'%</div></div><div class="mi"><div class="ml">BTTS</div><div class="mv">'+mk.bt+'%</div></div></div>'+
      statsBlock(m)+
      (m.odds?'<div class="mk3"><div class="mi"><div class="ml">Cuota 1</div><div class="mv">'+m.odds.h+'</div></div><div class="mi"><div class="ml">Cuota X</div><div class="mv">'+m.odds.d+'</div></div><div class="mi"><div class="ml">Cuota 2</div><div class="mv">'+m.odds.a+'</div></div></div>':'')+
      (m.value&&m.value.length?'<div class="note" style="color:var(--p);font-weight:bold">💎 Value: '+m.value.map(function(v){return v.side+' +'+v.edge+'%';}).join(' · ')+'</div>':'');}
    h+='</div>';});
  $('grid').innerHTML=h;
  requestAnimationFrame(function(){var e=document.querySelectorAll('.pf');for(var i=0;i<e.length;i++)e[i].style.width=(e[i].getAttribute('data-w')||0)+'%';});
}
function openM(id){var m=null;for(var i=0;i<ALL.length;i++){if(ALL[i].id===id){m=ALL[i];break;}}if(!m)return;var mk=markets(m.hL,m.aL);
  var mt=m.main==='home'?'Victoria Local':(m.main==='away'?'Victoria Visitante':'Empate');
  var mp=Math.max(m.probs.home,m.probs.draw,m.probs.away);
  var stSec=m.stats?('<div class="sec"><div class="stt">📊 Stats reales (promedio temporada)</div>'+
    '<div class="rw"><span class="rl">Tiros</span><span class="rv">'+m.stats.home.sh+' - '+m.stats.away.sh+'</span></div>'+
    '<div class="rw"><span class="rl">A puerta</span><span class="rv">'+m.stats.home.sot+' - '+m.stats.away.sot+'</span></div>'+
    '<div class="rw"><span class="rl">Córners</span><span class="rv">'+m.stats.home.cor+' - '+m.stats.away.cor+'</span></div>'+
    '<div class="rw"><span class="rl">Faltas</span><span class="rv">'+m.stats.home.fou+' - '+m.stats.away.fou+'</span></div>'+
    '<div class="rw"><span class="rl">Amarillas</span><span class="rv">'+m.stats.home.yc+' - '+m.stats.away.yc+'</span></div>'+
    '<div class="rw"><span class="rl">xG</span><span class="rv">'+m.stats.home.xg+' - '+m.stats.away.xg+'</span></div></div>')
   :('<div class="sec"><div class="stt">⚠️ No disponible para esta liga</div><div class="rw"><span class="rl">Tiros/Córners/Faltas/xG</span><span class="rv">n/d — no los inventamos</span></div></div>');
  $('mb').innerHTML='<div class="stt" style="text-align:center;font-size:.95rem;color:var(--p)">📊 '+m.home+' vs '+m.away+'</div>'+
   '<div class="sec"><div class="stt">🔮 Predicción</div><div class="rw"><span class="rl">Marcador</span><span class="rv">'+mk.top[0].h+'-'+mk.top[0].a+'</span></div><div class="rw"><span class="rl">Resultado</span><span class="rv">'+mt+' ('+mp+'%)</span></div><div class="rw"><span class="rl">1/X/2</span><span class="rv">'+m.probs.home+'/'+m.probs.draw+'/'+m.probs.away+'</span></div><div class="rw"><span class="rl">λ (goles esp.)</span><span class="rv">'+m.hL+' / '+m.aL+'</span></div><div class="rw"><span class="rl">Forma L/V</span><span class="rv">'+(m.formHome||[]).join('')+' / '+(m.formAway||[]).join('')+'</span></div></div>'+
   '<div class="sec"><div class="stt">📈 Goles</div><div class="rw"><span class="rl">+1.5/+2.5/+3.5</span><span class="rv">'+mk.o15+'/'+mk.o25+'/'+mk.o35+'</span></div><div class="rw"><span class="rl">BTTS</span><span class="rv">'+mk.bt+'%</span></div><div class="rw"><span class="rl">Top marcadores</span><span class="rv">'+mk.top.map(function(s){return s.h+'-'+s.a;}).join(', ')+'</span></div></div>'+
   stSec+
